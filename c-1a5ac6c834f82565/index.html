:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#15212C; --muted:#5F6B78; --line:#D7DDE3; --soft:#F5F7F8;
  --accent:#1E7A52; --accent-ink:#FFFFFF;
  --h1:#E3F2E9; --h2:#C2E5D0; --h3:#86C9A3; --h4:#1E7A52;
  --warn:#A2650F; --warn-bg:#FBF1E0; --bad:#A8473A;
  --r-card:14px; --r-tile:10px; --r-input:8px;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cabecera */
.top{padding:22px 0 14px}
.top h1{font:700 30px/1.05 var(--f-disp);letter-spacing:.2px;margin:0}
.top h1 span{color:var(--accent)}
.top .lede{margin:4px 0 12px;color:var(--muted);max-width:70ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stamp{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.stamp b{color:var(--ink);font-weight:600}
.stamp .old{color:var(--warn);font-weight:600}
.meta .m{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink)}
.meta .m b{font-weight:600}
.meta .m.link{background:var(--ink);border-color:var(--ink);color:#fff;text-decoration:none;font-weight:600}
.meta .m.link:hover{background:var(--accent);border-color:var(--accent)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 18px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.note svg{flex:none;margin-top:1px}
.note b{display:block;font-weight:600}

/* estructura */
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start;padding-bottom:120px}

/* selector de partidos */
.picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);position:sticky;top:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column}
.picker>summary{list-style:none;cursor:pointer;padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
.picker>summary::-webkit-details-marker{display:none}
.picker>summary h2{font:700 20px var(--f-disp);margin:0}
.picker>summary .count{font-size:13px;color:var(--muted)}
.picker>summary .chev{display:none}
.pk-body{padding:4px 16px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input{width:100%;border:1px solid var(--line);border-radius:var(--r-input);padding:9px 11px;font:inherit;background:var(--soft)}
.field input:focus{background:#fff;border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(30,122,82,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;line-height:1.2}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.7;margin-left:3px}
.pk-list{overflow:auto;min-height:120px;margin:0 -16px;padding:0 8px;border-top:1px solid var(--line)}
.pk-day{font:600 12.5px var(--f-body);color:var(--muted);padding:10px 8px 4px;position:sticky;top:0;background:var(--surface);z-index:1}
.pk-item{display:grid;grid-template-columns:22px 48px 1fr;gap:8px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.pk-item:hover{background:var(--soft)}
.pk-item input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.pk-item .h{font:500 13px var(--f-mono);color:var(--muted)}
.pk-item .t{font-weight:600;line-height:1.2}
.pk-item .l{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pk-item.on{background:#E9F4EE}
.badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:11.5px;font-weight:600;background:var(--h2);color:#0F4A31}
.badge.grey{background:#E6EAEE;color:var(--muted)}
.pk-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-input);padding:7px 12px;font-size:13.5px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.empty-list{padding:16px 8px;color:var(--muted);font-size:14px}

/* resultados */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-card);padding:40px 24px;text-align:center;color:var(--muted)}
.empty h2{font:700 22px var(--f-disp);color:var(--ink);margin:0 0 6px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:18px;overflow:hidden}
.mh{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--line);align-items:start}
.mh .kick{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mh .kick b{color:var(--ink);font:600 13px var(--f-mono)}
.mh h2{font:700 28px/1.05 var(--f-disp);margin:4px 0 6px}
.mh h2 .vs{color:var(--muted);font-weight:600;margin:0 6px}
.mh .xg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.mh .xg b{color:var(--ink);font-weight:600}
.mh .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.mh .rlink{font-size:13.5px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:var(--r-input);padding:6px 10px;white-space:nowrap}
.mh .rlink:hover{border-color:var(--accent)}
.mh .rid{font-size:12px;color:var(--muted)}
.tag-started{background:#E6EAEE;color:var(--muted);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px auto 1fr auto;gap:10px;align-items:center;padding:12px 18px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:var(--soft)}
.sec>summary .num{font:700 15px var(--f-disp);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line)}
.sec>summary h3{font:700 19px var(--f-disp);margin:0}
.sec>summary .sum{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec>summary .right{display:flex;gap:8px;align-items:center}
.sec>summary .caret{transition:transform .2s;color:var(--muted)}
.sec[open]>summary .caret{transform:rotate(180deg)}
.sec-body{padding:2px 18px 18px}
.sub{font:600 13px var(--f-body);color:var(--muted);margin:14px 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sub:first-child{margin-top:4px}
.sub em{font-style:normal;font-weight:400}
.srcnote{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:7px 10px;margin:4px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pair{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--soft)}
.pair .pl{font:600 13px var(--f-body);color:var(--muted);margin:0 2px 6px}
.pair .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ficha de mercado */
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);padding:9px 10px 12px;cursor:pointer;min-width:0;overflow:hidden}
.tile:hover{border-color:#9AA6B2}
.tile .tl{font-size:13px;font-weight:600;line-height:1.2;padding-right:20px;color:var(--ink)}
.tile .ts{font-size:11.5px;color:var(--muted);line-height:1.2}
.tile .tp{font:700 30px/1 var(--f-disp);margin:5px 0 3px;letter-spacing:.2px}
.tile .tp small{font-size:16px;font-weight:600;margin-left:2px;color:var(--muted)}
.tile .tf{font-size:12px;color:var(--muted)}
.tile .tf b,.tile .tr b{font:600 13px var(--f-body);color:var(--ink)}
.tile .tr{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:1px}
.tile .tr.none{opacity:.8}
.edge{font:600 12px var(--f-body);border-radius:999px;padding:1px 6px;background:#E8ECEF;color:var(--muted)}
.edge.pos{background:#DDEFE4;color:#14603F}
.tile .tc{font-size:11.5px;margin-top:2px;display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.alta{background:var(--accent)}.dot.media{background:var(--warn)}.dot.baja{background:var(--bad)}
.tile .corr{font-size:11.5px;color:var(--warn);display:flex;gap:4px;align-items:center;font-weight:600;margin-top:2px}
.tile .tm{font-size:11px;color:var(--muted);margin-top:2px}
.rail{position:absolute;left:0;right:0;bottom:0;height:4px;background:#E6EAEE}
.rail i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);opacity:.55;width:var(--w);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.rail u{position:absolute;top:-3px;bottom:-1px;width:2px;background:var(--bad);left:var(--x)}
.tile .ck{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:5px;border:1.5px solid #B4BEC8;display:grid;place-items:center;background:#fff}
.tile .ck svg{opacity:0}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile[aria-pressed="true"] .ck{background:var(--ink);border-color:var(--ink)}
.tile[aria-pressed="true"] .ck svg{opacity:1}
.tile.h1{background:var(--h1);border-color:#B9DCC7}
.tile.h2{background:var(--h2);border-color:#98CFAF}
.tile.h3{background:var(--h3);border-color:#5FB386}
.tile.h4{background:var(--h4);border-color:var(--h4)}

          '<div class="note">' + icoInfo + '<div><b>El modelo no ve bajas ni alineaciones</b>Tampoco lesiones, sanciones, rotaciones ni el cansancio tras el parón. Revisa convocatorias antes de decidir.' + (P.some(p => p.humano) ? ' En los partidos con contexto recogido, la sección 7 «Contexto humano» resume bajas y opinión del público como factor secundario.' : '') + '</div></div>';
  h += extra.map(x => '<div class="note warn">' + icoWarn + '<div><b>' + esc(jLabel(x.j)) + '</b>' + esc(x.a) + '</div></div>').join('');
  $('#notes').innerHTML = h;
  $('#notes-sum').innerHTML = icoWarn + '<span>Avisos importantes (' + (2 + extra.length) + '): correlación, bajas' + (extra.length ? ' y correcciones' : '') + '</span><span class="chev" aria-hidden="true">▾</span>';
}

// ---------- cálculo a partir de la matriz y las distribuciones
function matrixCalc(M){
  const n = M.length; const r = {home:Array(n).fill(0), away:Array(n).fill(0), tot:Array(2*n).fill(0), p1:0, px:0, p2:0, btts:0};
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){ const v = M[i][j]; r.home[i]+=v; r.away[j]+=v; r.tot[i+j]+=v; if(i>j) r.p1+=v; else if(i===j) r.px+=v; else r.p2+=v; if(i>0&&j>0) r.btts+=v; }
  r.over = L => r.tot.reduce((s,v,k) => s + (k > L ? v : 0), 0);
  r.overH = L => r.home.reduce((s,v,k) => s + (k > L ? v : 0), 0);
  r.overA = L => r.away.reduce((s,v,k) => s + (k > L ? v : 0), 0);
  return r;
}
const pOver = (pmf, L) => { let c = 0; for (let k=0;k<=Math.floor(L) && k<pmf.length;k++) c += pmf[k]; return Math.max(0, 1 - c); };
const pmfMean = pmf => pmf.reduce((s,v,k) => s + v*k, 0);

function heat(e){ if (e == null || e < EDGE_MIN - 1e-9) return ''; if (e >= 0.10) return 'h4'; if (e >= 0.07) return 'h3'; if (e >= 0.05) return 'h2'; return 'h1'; }

// s: {key,label,sub,p,m (mercado o null),pm (P de matriz, opcional),pid}
function tile(p, s){
  const m = s.m && s.m.cuota != null ? s.m : null;
  const key = p.id + '|' + s.key;
  const on = !!st.picks[key];
  const cls = 'tile ' + (m && m.valor ? heat(m.edge) : '');
  const reg = {pid:p.id, key:s.key, label:s.label + (s.sub ? ' ' + s.sub : ''), sec:s.sec, p:s.p, cuota:m ? m.cuota : null};
  REG[key] = reg;
  let h = '<button type="button" class="' + cls + '" data-pick="' + esc(key) + '" aria-pressed="' + on + '" aria-label="' + esc(s.label + (s.sub ? ' ' + s.sub : '') + ': probabilidad ' + pctS(s.p) + ', cuota justa ' + fair(s.p) + (m ? ', Retabet ' + odd(m.cuota) + ', edge ' + ppS(m.edge) : ', sin cuota de Retabet')) + '">';
  h += '<span class="ck">' + icoCheck + '</span><span class="tl">' + esc(s.label) + '</span>';
  if (s.sub) h += '<span class="ts">' + esc(s.sub) + '</span>';
  h += '<span class="tp">' + pct(s.p) + '<small>%</small></span>';
  h += '<span class="tf">Cuota justa <b>' + fair(s.p) + '</b></span>';
  if (m) h += '<span class="tr">Retabet <b>' + odd(m.cuota) + '</b><em class="edge' + (m.edge > 0 ? ' pos' : '') + '">' + ppS(m.edge) + '</em></span>';
  else h += '<span class="tr none">Sin cuota en Retabet</span>';
  if (m && m.valor && m.conf) h += '<span class="tc"><i class="dot ' + m.conf + '"></i>Confianza ' + m.conf + '</span>';
  if (s.m && s.m.avisos && s.m.avisos.some(a => a.tipo === 'correccion')) h += '<span class="corr">' + icoWarn + 'Corrección: optimista</span>';
  if (s.pm != null && Math.abs(s.pm - s.p) > 0.0005) h += '<span class="tm">Matriz bruta: ' + pctS(s.pm) + '</span>';
  h += '<span class="rail"><i style="--w:' + (ANIM ? 0 : (s.p*100).toFixed(1)) + '%" data-w="' + (s.p*100).toFixed(1) + '"></i>' + (m ? '<u style="--x:' + Math.min(99.5, m.p_impl*100).toFixed(1) + '%" title="P implícita ' + pctS(m.p_impl) + '"></u>' : '') + '</span>';
  return h + '</button>';
}
function naTile(label, sub){ return '<div class="tile na"><span class="tl">' + esc(label) + '</span>' + (sub ? '<span class="ts">' + esc(sub) + '</span>' : '') + '<span class="tp">—</span><span class="tf">Sin modelo</span></div>'; }
let REG = {}; let ANIM = true;

function footnotes(p, items){
  const out = []; let corr = null; const seen = new Set();
  items.forEach(s => {
    const m = s.m; if (!m || !m.avisos) return;
    m.avisos.forEach(a => { if (a.tipo === 'correccion') corr = a.texto; });
    if (!m.valor) return;
    const lab = s.label + (s.sub ? ' ' + s.sub : '');
    if (seen.has(lab)) return; seen.add(lab);
    const txt = m.avisos.filter(a => a.tipo !== 'correccion').map(a => esc(a.texto));
    if (txt.length) out.push('<li><b>' + esc(lab) + ':</b><span>' + txt.join(' ') + '</span></li>');
  });
  if (corr) out.unshift('<li class="w">' + icoWarn + '<span><b>Menos tarjetas:</b> ' + esc(corr) + '</span></li>');
  return out.length ? '<ul class="foot">' + out.join('') + '</ul>' : '';
}
function section(p, idx, id, title, summary, body, nEdge, extra){
  extra = extra || {};
  const k = p.id + ':' + id; const open = st.open[k] === undefined ? (!mq.matches || id === 'res' || id === 'btts' || (id === 'hum' && extra.alert)) : st.open[k];
  return '<details class="sec' + (extra.cls ? ' ' + extra.cls : '') + '" data-sec="' + esc(k) + '"' + (open ? ' open' : '') + '><summary><span class="num">' + idx + '</span><h3>' + esc(title) + '</h3><span class="sum">' + summary + '</span><span class="right">' + (nEdge ? '<span class="badge">' + nEdge + ' con edge ≥ 3 pp</span>' : '') + (extra.badge || '') + caret + '</span></summary><div class="sec-body">' + body + '</div></details>';
}
const countEdge = items => items.filter(s => s.m && s.m.valor).length;

function renderMatch(p){
  const out = [];
  const M = p.matriz ? matrixCalc(p.matriz) : null;
  const mk = p.mk;
  const fin = name => mk[name] ? mk[name].p_modelo : null;
  // 1) Resultado
  const r1 = fin('1X2 · 1') ?? (M && M.p1), rx = fin('1X2 · X') ?? (M && M.px), r2 = fin('1X2 · 2') ?? (M && M.p2);
  const sRes = [

    {key:'X', label:'X · Empate', p:rx, m:mk['1X2 · X'], pm:M && M.px, sec:'Resultado'},
    {key:'2', label:'2 · Gana ' + p.visitante, p:r2, m:mk['1X2 · 2'], pm:M && M.p2, sec:'Resultado'}];
  const sDo = [
    {key:'1X', label:'1X', sub:p.local + ' o empate', p:r1 + rx, sec:'Doble oportunidad'},
    {key:'12', label:'12', sub:'Gana alguno', p:r1 + r2, sec:'Doble oportunidad'},

  b += '<div class="sub">Doble oportunidad <em>· suma de las P finales del 1X2; Retabet no da cuota aquí</em></div><div class="grid g3">' + sDo.map(s => tile(p,s)).join('') + '</div>';
  b += footnotes(p, sRes);
  out.push(section(p, 1, 'res', 'Resultado', '1 ' + pctS(r1) + ' · X ' + pctS(rx) + ' · 2 ' + pctS(r2), b, countEdge(sRes)));

  // 2) Goles
  if (M){
    const pairs = []; const allG = [];
    [0.5,1.5,2.5,3.5,4.5].forEach(L => {
      const lab = line(L).replace('.', ',');
      const mo = mk['Goles Más de ' + lab], mu = mk['Goles Menos de ' + lab];
      const po = M.over(L);
      const so = {key:'O'+L, label:'Más de ' + lab, p: mo ? mo.p_modelo : po, m:mo, pm: po, sec:'Goles'};
      const su = {key:'U'+L, label:'Menos de ' + lab, p: mu ? mu.p_modelo : 1 - po, m:mu, pm: 1 - po, sec:'Goles'};
      allG.push(so, su);
      pairs.push('<div class="pair"><div class="pl">' + lab + ' goles</div><div class="two">' + tile(p,so) + tile(p,su) + '</div></div>');
    });
    const ex = [0,1,2,3].map(k => ({key:'T'+k, label: k + (k === 1 ? ' gol' : ' goles'), p:M.tot[k], sec:'Goles exactos'}));
    ex.push({key:'T4+', label:'4 o más', p:1 - M.tot[0] - M.tot[1] - M.tot[2] - M.tot[3], sec:'Goles exactos'});
    const team = (name, f, pre) => '<div class="pairs">' + [0.5,1.5,2.5].map(L => {
      const lab = line(L); const po = f(L);
      return '<div class="pair"><div class="pl">' + esc(name) + ' · ' + lab + '</div><div class="two">' +
        tile(p,{key:pre+'O'+L, label:'Más de ' + lab, p:po, sec:'Goles ' + name}) + tile(p,{key:pre+'U'+L, label:'Menos de ' + lab, p:1-po, sec:'Goles ' + name}) + '</div></div>'; }).join('') + '</div>';
    let g = '<div class="srcnote">0,5 y 4,5, goles exactos y goles por equipo salen de la matriz de goles del modelo. En 1,5, 2,5 y 3,5 la P grande es la final del modelo (contraída hacia la media de la liga y mezclada 70/30 con el mercado); debajo verás la de la matriz bruta cuando difiere.</div>';
    g += '<div class="sub">Total de goles</div><div class="pairs">' + pairs.join('') + '</div>' + footnotes(p, allG);
    g += '<div class="sub">Goles exactos en el partido</div><div class="grid g5">' + ex.map(s => tile(p,s)).join('') + '</div>';
    g += '<div class="sub">Goles de ' + esc(p.local) + ' <em>· esperados ' + fmtEsp(p.ctx.goles && p.ctx.goles[0]) + '</em></div>' + team(p.local, M.overH, 'H');
    g += '<div class="sub">Goles de ' + esc(p.visitante) + ' <em>· esperados ' + fmtEsp(p.ctx.goles && p.ctx.goles[1]) + '</em></div>' + team(p.visitante, M.overA, 'A');
    const o25 = allG.find(s => s.key === 'O2.5');
    out.push(section(p, 2, 'gol', 'Goles', 'Esperados ' + fmtEsp(p.ctx.goles[0]) + ' – ' + fmtEsp(p.ctx.goles[1]) + ' · más de 2,5: ' + pctS(o25.p), g, countEdge(allG)));
  }
  // 3) Ambos marcan
  const bs = mk['BTTS Sí'], bn = mk['BTTS No'];
  const sB = [{key:'BTTS_si', label:'Ambos marcan: Sí', p: bs ? bs.p_modelo : M && M.btts, m:bs, pm:M && M.btts, sec:'Ambos marcan'},
              {key:'BTTS_no', label:'Ambos marcan: No', p: bn ? bn.p_modelo : M && 1 - M.btts, m:bn, pm:M && 1 - M.btts, sec:'Ambos marcan'}];
  out.push(section(p, 3, 'btts', 'Ambos marcan', 'Sí ' + pctS(sB[0].p) + ' · No ' + pctS(sB[1].p),
    '<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px">' + sB.map(s => tile(p,s)).join('') + '</div>' + footnotes(p, sB), countEdge(sB)));
  // 4) Marcador exacto
  if (M){
    const N = 6, mat = p.matriz; let shown = 0, mx = 0;
    for (let i=0;i<N;i++) for (let j=0;j<N;j++){ shown += mat[i][j]; mx = Math.max(mx, mat[i][j]); }
    let t = '<table class="csm"><caption class="cs-cap">Filas: goles de <b>' + esc(p.local) + '</b> · columnas: goles de <b>' + esc(p.visitante) + '</b></caption><thead><tr><th class="corner" aria-label="Local / visitante"></th>' + [...Array(N).keys()].map(j => '<th scope="col">' + j + '</th>').join('') + '</tr></thead><tbody>';
    for (let i=0;i<N;i++){
      t += '<tr><th scope="row">' + i + '</th>';
      for (let j=0;j<N;j++){
        const v = mat[i][j]; const a = Math.pow(v/mx, .8); const key = 'CS' + i + '-' + j; const k2 = p.id + '|' + key;
        REG[k2] = {pid:p.id, key, label:'Marcador ' + i + '-' + j, sec:'Marcador exacto', p:v, cuota:null};
        const dark = a > .55;
        t += '<td><button type="button" data-pick="' + k2 + '" aria-pressed="' + !!st.picks[k2] + '" aria-label="Marcador ' + i + '-' + j + ': ' + pctS(v) + ', cuota justa ' + fair(v) + '" style="background:rgba(30,122,82,' + (0.06 + a*0.9).toFixed(3) + ');color:' + (dark ? '#fff' : 'var(--ink)') + '"><b>' + pct(v) + '</b><span>' + fair(v) + '</span></button></td>';
      }

    const all = []; mat.forEach((row,i) => row.forEach((v,j) => all.push({i,j,v}))); all.sort((a,b) => b.v - a.v);
    const top = all.slice(0,8); const tmax = top[0].v;
    let l = '<ol class="top-list">' + top.map((c,k) => { const key = 'CS' + c.i + '-' + c.j, k2 = p.id + '|' + key;
      return '<li><button type="button" data-pick="' + k2 + '" aria-pressed="' + !!st.picks[k2] + '"><span class="rk">' + (k+1) + '.</span><span class="sc">' + c.i + '-' + c.j + '</span><span class="bar"><i style="--w:' + (c.v/tmax*100).toFixed(1) + '%"></i></span><span class="pv">' + pctS(c.v) + '<small>justa ' + fair(c.v) + '</small></span></button></li>'; }).join('') + '</ol>';
    const cs = '<div class="srcnote">Matriz de goles del modelo (sin contracción ni mezcla con el mercado). En cada casilla: P y, debajo, cuota justa. Marcadores con 6 o más goles de un equipo: ' + pctS(Math.max(0, 1 - shown)) + '. Retabet no da cuotas de marcador en los datos.</div><div class="cs"><div style="overflow-x:auto">' + t + '</div><div><div class="sub" style="margin-top:0">Los 8 más probables</div>' + l + '</div></div>';
    out.push(section(p, 4, 'cs', 'Marcador exacto', 'Más probable ' + top[0].i + '-' + top[0].j + ' (' + pctS(top[0].v) + ') · luego ' + top[1].i + '-' + top[1].j + ' y ' + top[2].i + '-' + top[2].j, cs, 0));
  }
  // 5) Córners
  out.push(cornersSection(p));

  if (p.humano) out.push(humanSection(p));
  return out.join('');
}

// ---------- 7) contexto humano (factor secundario, separado del modelo)

const fdate = f => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(f || ''); return m ? (+m[3]) + ' ' + MESC[+m[2]-1] : 's/f'; };

function bar3(v, pub){

function humanSection(p){

  });
  if (a) b += '<div class="hum-alerts">' + a + '</div>';

  c += '</div><div class="cmp-key"><span>Favorito del modelo: <b>' + esc(favM) + ' · ' + esc(favName(favM)) + '</b> (' + pctS(pm[favM]) + ')</span><span>Favorito del público: <b>' + (favP ? esc(favP) + ' · ' + esc(favName(favP)) : '—') + '</b></span>' + (n < MIN_N ? '<span class="hc ins">Muestra insuficiente (n < ' + MIN_N + ')</span>' : '') + '</div>';
  if (!pub && s.motivo) c += '<p class="inj-t" style="margin:8px 0 0">' + esc(s.motivo) + '</p>';
  const extraBar = (lab, obj) => obj ? '<div class="cmp" style="margin-top:6px"><span class="lab">' + esc(lab) + '</span><div class="bar3 pub">' + Object.keys(obj).map((k,i) => '<span class="' + ['b1','b2','bx'][i % 3] + '" style="width:' + (obj[k]*100).toFixed(1) + '%">' + esc(k) + ' ' + nf1.format(obj[k]*100) + NB + '%</span>').join('') + '</div></div>' : '';
  if (pub) { c += extraBar('Goles', s.goles); c += extraBar('Ambos marcan', s.btts); }
  if (s.argumentos && s.argumentos.length) c += '<div class="sub">Argumentos que se repiten</div><ul class="rev">' + s.argumentos.map(x => '<li><span>·</span><span>' + esc(x) + '</span></li>').join('') + '</ul>';
  if (h.prensa && h.prensa.length) c += '<ul class="press">' + h.prensa.map(x => '<li>Prensa (no entra en la barra): <a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' + esc(x.medio) + '</a> «' + esc(x.pronostico) + '» · ' + esc(fdate(x.fecha)) + '</li>').join('') + '</ul>';
  c += '</div>';
  // revisión de picks
  let r = '<div class="hum-box"><h4>Picks con edge frente a las bajas</h4>';
  if (h.revision_picks && h.revision_picks.length) r += '<ul class="rev">' + h.revision_picks.map(x => '<li><span class="vd ' + esc(x.veredicto) + '">' + esc(x.veredicto) + '</span><span><b>' + esc(x.mercado) + '</b> a ' + odd(x.cuota) + ' · edge ' + ppS(x.edge) + '</span><span class="m">' + esc(x.motivo) + '</span></li>').join('') + '</ul>';
  else r += '<p class="inj-none">Este partido no tiene picks con edge en el modelo.</p>';
  r += '<div class="hum-dir"><b>Dirección:</b> ' + esc((h.impacto || {}).direccion_pick || '—') + '</div></div>';
  b += '<div class="hum-grid">' + c + r + '</div>';
  // bajas
  const side = (k, name) => {
    const imp = (h.impacto || {})[k] || {}; const L = (h.bajas || {})[k] || [];
    let t = '<div><div class="inj-h"><h4>' + esc(name) + '</h4>' + (imp.nivel ? '<span class="imp ' + esc(imp.nivel) + '">Impacto ' + esc(imp.nivel) + '</span>' : '') + '</div>' + (imp.texto ? '<p class="inj-t">' + esc(imp.texto) + '</p>' : '');
    if (!L.length) return t + '<p class="inj-none">Sin bajas conocidas.</p></div>';
    t += '<ul class="inj">' + L.map(x => '<li' + (x.titular_habitual ? ' class="k"' : '') + '><div class="r1"><span class="nm">' + esc(x.jugador) + '</span><span class="ps">' + esc(x.posicion) + '</span>' +
      (x.titular_habitual ? '<span class="hc tit">Titular</span>' : '<span class="hc sup">No titular</span>') +
      (x.estado === 'fuera' ? '<span class="hc out">Fuera</span>' : '<span class="hc dud">Duda</span>') + '</div>' +
      '<div class="mo">' + esc(x.motivo) + (x.nota ? ' <span class="det">· ' + esc(x.nota) + '</span>' : '') + '</div>' +
      '<div class="src">' + (x.fuentes || []).map(f => '<a href="' + esc(f.url) + '" target="_blank" rel="noopener noreferrer">' + esc(f.medio) + ' ↗</a> ' + esc(fdate(f.fecha))).join(' · ') + (x.titular_detalle ? ' <span class="det">· ' + esc(x.titular_detalle) + '</span>' : '') + '</div></li>').join('') + '</ul></div>';
    return t;
  };
  b += '<div class="inj-cols">' + side('local', p.local) + side('visitante', p.visitante) + '</div>';
  const nTit = ['local','visitante'].reduce((acc,k) => acc + ((h.bajas || {})[k] || []).filter(x => x.titular_habitual).length, 0);
  const sum = 'Público: ' + (pub ? esc(favP) + ' (n = ' + n + ')' : 'sin datos') + ' · ' + nTit + ' titulares fuera o en duda';
  const badge = al.length ? '<span class="badge ' + (al.some(x => x.nivel === 'alta') ? 'badb' : 'warnb') + '">' + al.length + (al.length === 1 ? ' alerta' : ' alertas') + '</span>' : '';
  return section(p, 7, 'hum', 'Contexto humano', sum, b, 0, {cls:'hum', badge, alert: al.length > 0});
}

function lineRange(mean, extra, span){
  const c = Math.floor(mean); const set = new Set();
  for (let k = Math.max(0, c - span); k <= c + span; k++) set.add(k + 0.5);
  extra.forEach(L => set.add(L)); return [...set].sort((a,b) => a-b);
}
function ouPairs(p, pmf, lines, findM, labelPre, secName, keyPre){
  const items = []; const html = lines.map(L => {
    const lab = line(L); const po = pOver(pmf, L);
    const f = findM(L) || {};
    const so = {key:keyPre+'O'+L, label:'Más de ' + lab, sub:f.subO, p: f.mo ? f.mo.p_modelo : po, m:f.mo, sec:secName};
    const su = {key:keyPre+'U'+L, label:'Menos de ' + lab, p: f.mu ? f.mu.p_modelo : 1 - po, m:f.mu, sec:secName};
    items.push(so, su);
    return '<div class="pair"><div class="pl">' + esc(labelPre) + ' · ' + lab + '</div><div class="two">' + tile(p,so) + tile(p,su) + '</div></div>';
  }).join('');
  return {html:'<div class="pairs">' + html + '</div>', items};
}
function cornersSection(p){
  const d = p.dist_corners || {};
  if (!d.total) return section(p, 5, 'cor', 'Córners', 'Sin modelo para este partido', '<p class="na-msg">El modelo no calcula córners para este partido' + ' (Retabet no ofrece ese mercado en los datos).</p>', 0);
  const mk = p.mk; const mean = p.ctx.corners != null ? p.ctx.corners : pmfMean(d.total);
  const extra = [];
  p.mercados.forEach(m => { let r;
    if ((r = m.mercado.match(/^Córners (?:Más|Menos) de (\d+),5$/))) extra.push(+r[1] + 0.5);
    if ((r = m.mercado.match(/^Córners totales (\d+) o más$/))) extra.push(+r[1] - 0.5); });
  const lines = lineRange(mean, extra, 2);
  const findTot = L => { const lab = line(L); const n = Math.round(L + 0.5);
    const mo = mk['Córners Más de ' + lab] || mk['Córners totales ' + n + ' o más'];
    return {mo, mu: mk['Córners Menos de ' + lab], subO: mk['Córners totales ' + n + ' o más'] ? '(' + n + ' o más en Retabet)' : null}; };
  const tot = ouPairs(p, d.total, lines, findTot, 'Total', 'Córners', 'C');
  let b = '<div class="srcnote">Distribución de córners del modelo (binomial negativa). En córners la P es la del modelo puro, sin mezcla con el mercado.</div>';
  b += '<div class="sub">Córners totales <em>· esperados ' + fmtEsp(mean) + '</em></div>' + tot.html;
  let items = tot.items;
  const teamM = (who) => { const res = {}; p.mercados.forEach(m => { const r = m.mercado.match(/^Córners (.+) (\d+) o más$/); if (!r || r[1] === 'totales') return;
      const nm = r[1]; const isAway = nm === p.visitante || nm.includes(p.visitante) || p.visitante.includes(nm);
      const isHome = !isAway && (nm.includes(p.local) || p.local.includes(nm));
      if ((who === 'H' && isHome) || (who === 'A' && isAway)) res[+r[2] - 0.5] = {mo:m, subO:'(' + r[2] + ' o más en Retabet)'}; }); return res; };
  [['H', d.local, p.local, 0], ['A', d.visit, p.visitante, 1]].forEach(([w, pmf, name, ix]) => {
    if (!pmf) return; const tm = teamM(w); const meanT = p.ctx.corners_eq ? p.ctx.corners_eq[ix] : pmfMean(pmf);
    const r = ouPairs(p, pmf, lineRange(meanT, Object.keys(tm).map(Number), 1), L => tm[L], name, 'Córners ' + name, 'C' + w);
    b += '<div class="sub">Córners de ' + esc(name) + ' <em>· esperados ' + fmtEsp(meanT) + '</em></div>' + r.html; items = items.concat(r.items); });
  b += footnotes(p, items);
  const hasR = p.mercados.some(m => m.grupo === 'Córners');
  return section(p, 5, 'cor', 'Córners', 'Esperados ' + fmtEsp(mean) + (hasR ? '' : ' · Retabet no ofrece el mercado'), b, countEdge(items));
}
function cardsSection(p){
  const d = p.dist_tarjetas || {};
  const pmf = d.total || d.primera_parte;
  if (!pmf) return section(p, 6, 'tar', 'Tarjetas', 'Sin modelo para este partido', '<p class="na-msg">El modelo no calcula tarjetas para este partido (Retabet no ofrece ese mercado en los datos).</p>', 0);
  const mk = p.mk; const first = !d.total;
  const mean = first ? (p.ctx.tarjetas_1t != null ? p.ctx.tarjetas_1t : pmfMean(pmf)) : (p.ctx.tarjetas != null ? p.ctx.tarjetas : pmfMean(pmf));
  const extra = [];
  p.mercados.forEach(m => { let r;
    if ((r = m.mercado.match(/^Tarjetas (?:Más|Menos) de (\d+),5$/))) extra.push(+r[1] + 0.5);
    if ((r = m.mercado.match(/^Tarjetas 1ª parte (\d+) o más$/))) extra.push(+r[1] - 0.5); });
  const lines = lineRange(mean, extra, 2);
  const find = L => { const lab = line(L); const n = Math.round(L + 0.5);
    if (first) { const mo = mk['Tarjetas 1ª parte ' + n + ' o más']; return {mo, subO: mo ? '(' + n + ' o más en Retabet)' : null}; }
    return {mo: mk['Tarjetas Más de ' + lab], mu: mk['Tarjetas Menos de ' + lab]}; };
  const name = first ? 'Tarjetas 1ª parte' : 'Tarjetas';
  const r = ouPairs(p, pmf, lines, find, first ? '1ª parte' : 'Total', name, 'K');
  let b = '<div class="srcnote">' + (first ? 'Tarjetas de la 1ª parte' : 'Tarjetas del partido con la regla de Retabet: amarilla 1, roja 2 (la segunda amarilla no suma)') + '. Distribución del modelo (binomial negativa), sin mezcla con el mercado.' + (p.ctx.arbitro ? ' Árbitro: ' + esc(p.ctx.arbitro) + (p.ctx.arbitro_det ? ' (' + esc(p.ctx.arbitro_det) + ')' : '') + '.' : '') + '</div>';
  b += '<div class="sub">' + (first ? 'Tarjetas en la 1ª parte' : 'Tarjetas totales') + ' <em>· esperadas ' + fmtEsp(mean) + '</em></div>' + r.html + footnotes(p, r.items);
  const hasR = p.mercados.some(m => m.grupo === 'Tarjetas');
  return section(p, 6, 'tar', first ? 'Tarjetas (1ª parte)' : 'Tarjetas', 'Esperadas ' + fmtEsp(mean) + (hasR ? '' : ' · Retabet no ofrece el mercado'), b, countEdge(r.items));
}

function renderResults(){
  REG = {};
  const sel = st.sel.map(id => byId[id]).filter(Boolean).sort((a,b) => (a.ko || '').localeCompare(b.ko || ''));
  if (!sel.length){ $('#results').innerHTML = '<div class="empty"><h2>Elige un partido</h2><p>Marca uno o varios partidos en la lista para ver sus probabilidades.</p></div>'; renderCombo(); return; }
  const legend = '<div class="legend" style="margin:0 0 12px"><span>Edge frente a Retabet:</span><span><i class="sw" style="background:var(--h1)"></i>3–5 pp</span><span><i class="sw" style="background:var(--h2)"></i>5–7</span><span><i class="sw" style="background:var(--h3)"></i>7–10</span><span><i class="sw" style="background:var(--h4)"></i>≥ 10</span><span class="lg-x">Raya roja: P implícita de Retabet · toca una ficha para sumarla a la conjunta</span><span class="lg-b"><button class="btn" type="button" id="fold-all">Plegar todo</button> <button class="btn" type="button" id="unfold-all">Desplegar todo</button></span></div>';
  $('#results').innerHTML = legend + sel.map(p => {
    const link = p.retabet_url ? '<a class="rlink" href="' + esc(p.retabet_url) + '" target="_blank" rel="noopener noreferrer">Ver en Retabet ↗</a>'
      : '<a class="rlink" href="' + esc(D.retabet_futbol) + '" target="_blank" rel="noopener noreferrer">Buscar en Retabet ↗</a>';
    const c = p.ctx;
    const xg = [];
    if (c.goles) xg.push('Goles esperados <b>' + fmtEsp(c.goles[0]) + ' – ' + fmtEsp(c.goles[1]) + '</b>');
    if (c.forma && c.forma[0]) xg.push('Forma <b>' + esc(c.forma[0]) + '</b> / <b>' + esc(c.forma[1]) + '</b>');
    if (c.margen != null) xg.push('Margen 1X2 de Retabet <b>' + nf1.format(c.margen*100) + NB + '%</b>');
    if (c.pocos && c.pocos.length) xg.push('<span style="color:var(--warn)">Pocos datos: ' + esc(c.pocos.join(', ')) + '</span>');
    return '<article class="match" id="m-' + esc(p.id) + '"><div class="mh"><div><div class="kick"><b>' + esc(p.hora) + '</b><span>' + esc(p.dia_label) + ' · ' + esc(p.liga) + '</span>' + (started(p) ? '<span class="tag-started">Empezado</span>' : '') + '</div>' +
      '<h2>' + esc(p.local) + '<span class="vs">–</span>' + esc(p.visitante) + '</h2><div class="xg">' + xg.map(x => '<span>' + x + '</span>').join('') + '</div></div>' +
      '<div class="side">' + link + (!p.retabet_url && p.retabet_id ? '<span class="rid">ID de evento ' + esc(p.retabet_id) + '</span>' : '') + '<button class="btn" type="button" data-remove="' + esc(p.id) + '">Quitar partido</button></div></div>' +
      renderMatch(p) + '</article>';
  }).join('');
  if (ANIM) requestAnimationFrame(() => requestAnimationFrame(() => { document.querySelectorAll('.rail i[data-w]').forEach(i => i.style.setProperty('--w', i.dataset.w + '%')); ANIM = false; }));
  renderCombo();
}

// ---------- probabilidad conjunta
let comboOpen = false;
function renderCombo(){
  const keys = Object.keys(st.picks).filter(k => st.sel.includes(st.picks[k].pid));
  Object.keys(st.picks).forEach(k => { if (!keys.includes(k)) delete st.picks[k]; });
  const box = $('#combo');
  if (!keys.length){ box.hidden = true; document.body.style.paddingBottom = ''; return; }
  box.hidden = false; box.classList.toggle('open', comboOpen);
  const sels = keys.map(k => ({k, ...st.picks[k]}));
  const pJ = sels.reduce((a,s) => a * s.p, 1);
  const allQ = sels.every(s => s.cuota != null);
  const qJ = allQ ? sels.reduce((a,s) => a * s.cuota, 1) : null;
  const perMatch = {}; sels.forEach(s => { perMatch[s.pid] = (perMatch[s.pid] || 0) + 1; });
  const dup = Object.entries(perMatch).filter(([,n]) => n > 1);
  $('#combo-head').setAttribute('aria-expanded', comboOpen);
  $('#combo-head').innerHTML = '<h2>Probabilidad conjunta</h2><span class="kv"><span>' + sels.length + (sels.length === 1 ? ' selección' : ' selecciones') + '</span><span>P<b>' + pctS(pJ) + '</b></span><span>Cuota justa<b>' + fair(pJ) + '</b></span>' + (dup.length ? '<span style="color:#FFD08A">' + icoWarn + ' mismo partido</span>' : '') + '</span><span class="tog">' + (comboOpen ? 'Ocultar ▾' : 'Ver detalle ▴') + '</span>';
  let b = '';
  if (sels.length === 1) b += '<div class="combo-warn" style="background:rgba(255,255,255,.1);color:#fff">' + icoInfo + '<span>Marca otra selección (de este u otro partido elegido) para calcular la probabilidad conjunta.</span></div>';
  if (dup.length) b += '<div class="combo-warn">' + icoWarn + '<span><b>Hay selecciones del mismo partido</b> (' + dup.map(([id,n]) => esc(byId[id].local + '–' + byId[id].visitante) + ': ' + n).join('; ') + '). Están correlacionadas: la P multiplicada no es válida para ellas y puede estar muy lejos de la real. Algunas incluso se excluyen entre sí.</span></div>';
  b += '<ul class="combo-list">' + sels.map(s => { const p = byId[s.pid];
    return '<li><span>' + esc(s.label) + '<small>' + esc(p.local + ' – ' + p.visitante) + ' · ' + esc(s.sec) + '</small></span><span class="v">' + pctS(s.p) + '</span><span class="v q">' + (s.cuota != null ? 'Retabet ' + odd(s.cuota) : 'sin cuota') + '</span><button type="button" data-unpick="' + esc(s.k) + '" aria-label="Quitar ' + esc(s.label) + '">Quitar</button></li>'; }).join('') + '</ul>';
  b += '<div class="combo-grid"><div>P conjunta (multiplicada)<b>' + pctS(pJ) + '</b></div><div>Cuota justa combinada<b>' + fair(pJ) + '</b></div>' +
       '<div>Cuota Retabet combinada<b>' + (qJ ? odd(qJ) : '—') + '</b>' + (qJ ? '' : 'falta cuota en alguna') + '</div><div>P implícita de esa cuota<b>' + (qJ ? pctS(1/qJ) : '—') + '</b></div></div>';
  b += '<div class="combo-foot"><span>Cálculo local con las P del modelo. No se conecta con ninguna casa de apuestas.</span><button class="btn" type="button" id="combo-clear">Vaciar selecciones</button></div>';
  $('#combo-body').innerHTML = b;
  requestAnimationFrame(() => { document.body.style.paddingBottom = (box.querySelector('.combo-in').offsetHeight + 16) + 'px'; });
}

// ---------- pie
function renderFooter(){
  $('#footer').innerHTML = '<div class="cols"><div><h2>Cómo leerlo</h2><ul>' +
    '<li><b>P grande</b>: probabilidad del modelo. En 1X2, ambos marcan y goles 1,5/2,5/3,5 es la P final (modelo mezclado 70/30 con el mercado sin margen); el resto sale de la matriz de goles o de las distribuciones de córners y tarjetas.</li>' +
    '<li><b>Cuota justa</b> = 1 / P. <b>Edge</b> = P del modelo − 1 / cuota de Retabet, en puntos porcentuales. Se resalta desde ' + nf1.format(EDGE_MIN*100) + ' pp con EV positivo.</li>' +
    '<li>Confianza (alta, media o baja) según el backtest del modelo; «media-baja» se muestra como baja.</li>' +
    '<li>Herramienta de lectura: no hace apuestas ni se conecta con ninguna casa. La decisión es tuya.</li></ul></div>' +
    '<div><h2>Datos cargados</h2><ul>' + D.jornadas.map(j => '<li><b>' + esc(j.titulo) + '</b><br><code>' + esc(j.carpeta + '/' + j.json.split('/').pop()) + '</code> · modelo generado ' + esc((j.generado || '').replace('T',' ')) + ' · ' + j.n + ' partidos · cuotas ' + esc(j.tomadas_txt || '—') + '</li>').join('') +
    '</ul><p>Fuente de estadísticas: ESPN (API pública JSON). SofaScore bloquea su API (403), así que no se usa. Horas en Europe/Madrid. Panel generado el ' + esc(new Intl.DateTimeFormat('es-ES',{timeZone:TZ,day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(D.generado))) + ' con <code>build_dashboard.py</code>.</p></div></div>';
}

// ---------- eventos
function rerender(all){ renderPicker(); if (all) renderResults(); save(); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-dia],[data-liga],[data-pick],[data-unpick],[data-remove],#sel-vis,#sel-none,#combo-head,#combo-clear,#fold-all,#unfold-all');
  if (!t) return;
  if (t.dataset.dia){ st.dia = t.dataset.dia; rerender(false); return; }
  if (t.dataset.liga){ st.liga = t.dataset.liga; rerender(false); return; }
  if (t.dataset.pick){ const k = t.dataset.pick; if (st.picks[k]) delete st.picks[k]; else if (REG[k]) st.picks[k] = REG[k];
    document.querySelectorAll('[data-pick="' + CSS.escape(k) + '"]').forEach(x => x.setAttribute('aria-pressed', !!st.picks[k])); renderCombo(); save(); return; }
  if (t.dataset.unpick){ const k = t.dataset.unpick; delete st.picks[k]; document.querySelectorAll('[data-pick="' + CSS.escape(k) + '"]').forEach(x => x.setAttribute('aria-pressed','false')); renderCombo(); save(); return; }
  if (t.dataset.remove){ st.sel = st.sel.filter(id => id !== t.dataset.remove); rerender(true); return; }
  if (t.id === 'sel-vis'){ visibleMatches().forEach(p => { if (!st.sel.includes(p.id)) st.sel.push(p.id); }); rerender(true); return; }
  if (t.id === 'sel-none'){ st.sel = []; st.picks = {}; rerender(true); return; }
  if (t.id === 'combo-head'){ comboOpen = !comboOpen; renderCombo(); return; }
  if (t.id === 'combo-clear'){ st.picks = {}; document.querySelectorAll('[data-pick][aria-pressed="true"]').forEach(x => x.setAttribute('aria-pressed','false')); comboOpen = false; renderCombo(); save(); return; }
  if (t.id === 'fold-all' || t.id === 'unfold-all'){ const o = t.id === 'unfold-all'; document.querySelectorAll('.sec').forEach(d => { d.open = o; st.open[d.dataset.sec] = o; }); return; }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || !t.dataset.pid) return;
  const id = t.dataset.pid; if (t.checked){ if (!st.sel.includes(id)) st.sel.push(id); } else st.sel = st.sel.filter(x => x !== id);
  rerender(true);
});
document.addEventListener('toggle', e => { const d = e.target; if (d.classList && d.classList.contains('sec')) st.open[d.dataset.sec] = d.open; }, true);
$('#q').addEventListener('input', e => { st.q = e.target.value; renderPicker(); });
const syncPicker = () => { if (!mq.matches) { $('#picker').open = true; $('#notes-d').open = true; } };
$('#picker').addEventListener('toggle', () => { if (!mq.matches && !$('#picker').open) $('#picker').open = true; });
if (mq.matches && st.sel.length) $('#picker').open = false;
if (mq.matches) $('#notes-d').open = false;
$('#notes-d').addEventListener('toggle', () => { if (!mq.matches && !$('#notes-d').open) $('#notes-d').open = true; });
mq.addEventListener ? mq.addEventListener('change', syncPicker) : mq.addListener(syncPicker);

renderHeader(); renderPicker(); renderResults(); renderFooter();

// Cada minuto (y al volver a la pestaña) se quitan los partidos que hayan empezado desde que se abrió la página.
function tick(){
  const lastToday = today;
  const gone = prune();
  if (gone) {
    st.sel = st.sel.filter(id => byId[id]);
    if (st.dia !== 'todos' && !dias.includes(st.dia)) st.dia = pickDay();
    renderHeader(); rerender(true); renderFooter();
  } else if (today !== lastToday) { if (st.dia !== 'todos' && !dias.includes(st.dia)) st.dia = pickDay(); renderHeader(); renderPicker(); }
  else renderStamp();
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
